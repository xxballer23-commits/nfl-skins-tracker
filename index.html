<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NFL Skins League Tracker</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <div class="title">
    <h1>NFL Skins League</h1>
    <p>Results pull automatically from ESPN</p>
  </div>
  <div class="toolbar">
    <label class="field">
      <span>Season</span>
      <select id="season"></select>
    </label>
    <label class="field">
      <span>Skin value ($)</span>
      <input type="number" id="skin-value" min="0" step="1">
    </label>
    <span class="corrections" id="corrections">
      <button id="export" class="btn">Export corrections</button>
      <label class="btn" for="import-file">Import corrections</label>
      <input type="file" id="import-file" accept="application/json" hidden>
      <button id="reset" class="btn btn-danger">Discard corrections</button>
    </span>
  </div>
  <div class="status" id="status"></div>
</header>

<nav id="nav"></nav>
<main id="view"></main>

<footer id="footnote"></footer>

<script type="module" src="js/app.js"></script>
</body>
</html>
